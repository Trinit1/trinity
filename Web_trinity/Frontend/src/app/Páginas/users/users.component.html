<form class="row g-3" (ngSubmit)="crearUsuario()" #userForm="ngForm">
  
  <!-- Mensaje de error -->
  <div *ngIf="errorMensaje" class="col-12 alert alert-danger">
    {{ errorMensaje }}
  </div>

  <!-- FORMULARIO -->
  <div class="col-md-4">
    <input
      type="text"
      class="form-control"
      placeholder="Nombre completo"
      name="nombre"
      [(ngModel)]="usuario.nombre"
      required>
  </div>

  <div class="col-md-3">
    <input
      type="email"
      class="form-control"
      placeholder="Correo electrónico"
      name="email"
      [(ngModel)]="usuario.email"
      required
      email>
  </div>

  <div class="col-md-3">
    <input
      type="password"
      class="form-control"
      placeholder="Clave de acceso"
      name="password"
      [(ngModel)]="usuario.password"
      [required]="idEditando === null"
      [disabled]="idEditando !== null">
    <small *ngIf="idEditando !== null" class="text-warning">
      La contraseña no se puede editar
    </small>
  </div>

  <div class="col-md-2">
    <select
      class="form-select"
      name="rol"
      [(ngModel)]="usuario.rol"
      required>
      <option value="" disabled selected>Rol</option>
      <option value="admin">Admin</option>
      <option value="editor">Vendedor</option>
      <option value="visualizador">Usuario</option>
    </select>
  </div>

  <div class="col-12 text-end">
    <button 
      type="submit" 
      class="btn btn-info text-white fw-bold me-2"
      [disabled]="cargando || userForm.invalid">
      {{ idEditando !== null ? 'Actualizar' : 'Agregar' }}
      <span *ngIf="cargando" class="spinner-border spinner-border-sm ms-2"></span>
    </button>
    
    <button 
      *ngIf="idEditando !== null"
      type="button" 
      class="btn btn-secondary"
      (click)="cancelarEdicion()">
      Cancelar
    </button>
  </div>

</form>

<!-- LISTADO DE USUARIOS -->
<div class="table-responsive mt-4 col-12">
  <div *ngIf="cargando" class="text-center">
    <div class="spinner-border text-info"></div>
    <p>Cargando usuarios...</p>
  </div>
  
  <table *ngIf="!cargando" class="table table-dark table-striped align-middle text-center">
    <thead>
      <tr>
        <th>#</th>
        <th>Nombre</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let u of usuarios; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ u.nombre }}</td>
        <td>{{ u.email }}</td>
        <td>
          <span [ngClass]="{
            'badge bg-danger': u.rol === 'admin',
            'badge bg-warning': u.rol === 'editor',
            'badge bg-info': u.rol === 'visualizador'
          }">
            {{ u.rol }}
          </span>
        </td>
        <td>
          <button
            type="button"
            class="btn btn-sm btn-warning me-1"
            (click)="editarUsuario(u)">
            <i class="bi bi-pencil"></i> Editar
          </button>

          <button
            type="button"
            class="btn btn-sm btn-danger"
            (click)="eliminarUsuario(u.id)">
            <i class="bi bi-trash"></i> Eliminar
          </button>
        </td>
      </tr>

      <tr *ngIf="usuarios.length === 0">
        <td colspan="5" class="text-center">No hay usuarios registrados</td>
      </tr>
    </tbody>
  </table>
</div>
