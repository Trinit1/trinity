tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'net.serenity-bdd.aggregator'

group 'co.com.auto_try'
version '1.0-SNAPSHOT'

sourceCompatibility = 1.8

repositories {
    mavenLocal()
    jcenter()
    mavenCentral()
}

buildscript {
    repositories {
        mavenLocal()
        jcenter()
        mavenCentral()
    }
    ext {
        serenityVersion = "2.6.0"
        serenityGradleVersion = "2.3.31"
    }
    dependencies {
        classpath "net.serenity-bdd:serenity-gradle-plugin:$serenityGradleVersion"
    }
}

dependencies {
    implementation group: 'org.slf4j', name: 'slf4j-simple', version: "2.0.6"
    implementation group: 'org.hamcrest', name: 'hamcrest', version: "2.2"

    implementation "net.serenity-bdd:serenity-core:$serenityVersion"
    implementation "net.serenity-bdd:serenity-junit:$serenityVersion"
    implementation "net.serenity-bdd:serenity-screenplay:$serenityVersion"
    implementation "net.serenity-bdd:serenity-screenplay-webdriver:$serenityVersion"
    implementation "net.serenity-bdd:serenity-screenplay-rest:$serenityVersion"
    implementation "net.serenity-bdd:serenity-ensure:$serenityVersion"
    implementation "net.serenity-bdd:serenity-cucumber6:2.6.0"

    testImplementation "io.github.bonigarcia:webdrivermanager:5.6.3"
    testImplementation 'io.cucumber:cucumber-java:6.11.0'
    testImplementation 'io.cucumber:cucumber-junit:6.11.0'

    runtimeOnly fileTree(dir: 'libs', include: '*.jar')
    implementation group: 'com.jcraft', name: 'jsch', version: '0.1.55'
    implementation group: 'log4j', name: 'log4j', version: '1.2.17'
    implementation group: 'org.apache.poi', name: 'poi', version: '4.1.2'
    implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '4.1.2'
    implementation group: 'org.apache.commons', name: 'commons-math3', version: '3.6.1'

    testImplementation 'junit:junit:4.13.2'
}

test {
    testLogging.showStandardStreams = true
    systemProperties System.getProperties()

    jvmArgs = [
            '-Xmx1024m',
            '-Dfile.encoding=UTF-8'
    ]

    useJUnit()
    systemProperty "cucumber.options", "--plugin pretty --plugin json:target/cucumber.json"
    finalizedBy 'aggregate'

    systemProperty 'webdriver.driver', 'chrome'
    systemProperty 'webdriver.chrome.driver', 'driver/chromedriver.exe'
    systemProperty 'webdriver.autodownload', 'false'


    systemProperty 'chrome.switches', '--start-maximized;--remote-allow-origins=*;--no-sandbox;--disable-dev-shm-usage'
    systemProperty 'webdriver.timeouts.implicitlywait', '10000'

    systemProperty 'serenity.unhandled.prompt.behavior', 'accept'
    systemProperty 'webdriver.capabilities.unhandledPromptBehavior', 'accept'

    doFirst {
        jvmArgs += [
                '-Xshare:off',
                '-XX:+UseSerialGC'
        ]
    }
}

gradle.startParameter.continueOnFailure = true